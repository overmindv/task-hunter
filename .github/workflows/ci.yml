name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  PARSER_DATABASE_DSN: "postgres://parser:parser@localhost:5432/diploma_test?sslmode=disable"
  PARSER_SCHEDULE_COLLECTCRON: "0 */6 * * *"

jobs:
  # --- Линтинг ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # --- Тестирование (unit) ---
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -count=1 -timeout=120s ./internal/...

  # --- Тестирование (компонентное) ---
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parser
          POSTGRES_PASSWORD: parser
          POSTGRES_DB: diploma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Run component tests
        run: go test -count=1 -timeout=120s ./tests/...

  # --- Сборка ---
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: Build binary
        run: go build -ldflags="-s -w" -o parser ./cmd/parser

      - name: Check binary size
        run: ls -lh ./parser

  # --- Docker сборка ---
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, unit-tests, component-tests, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: task-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Полный e2e-прогон системы (см. overmindv/tests) при пуше/PR в этот сервис.
  e2e:
    permissions:
      contents: read
    uses: overmindv/tests/.github/workflows/e2e.yml@main
    secrets: inherit
    with:
      target_repo: task-hunter
